spring:
  datasource:
    url: jdbc:h2:mem:omsdevdb;DB_CLOSE_DELAY=-1;MODE=MySQL;DATABASE_TO_LOWER=TRUE
    username: sa
    password: ""
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
  h2:
    console:
      enabled: true
      path: /h2-console
      settings:
        web-allow-others: true

oms:
  security:
    jwt:
      secret: oms-dev-jwt-secret-key-that-is-at-least-32-bytes-long-for-local-testing!!
