spring:
  application:
    name: oms-backend
  profiles:
    # Production-safe default. Local development also uses MySQL per the SRS.
    active: ${SPRING_PROFILES_ACTIVE:prod}

  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/oms?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=utf8}
    username: ${DB_USERNAME:oms}
    password: ${DB_PASSWORD:oms}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:20}
      minimum-idle: 5
      connection-timeout: 30000
      pool-name: oms-hikari

  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:update}
    open-in-view: false
    properties:
      hibernate:
        format_sql: false
        jdbc:
          batch_size: 50
          time_zone: UTC
        order_inserts: true
        order_updates: true
    show-sql: ${JPA_SHOW_SQL:false}

  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 0

  servlet:
    multipart:
      enabled: true
      max-file-size: ${WORKPLACE_MAX_PLAN_BYTES:10MB}
      max-request-size: ${WORKPLACE_MAX_PLAN_BYTES:10MB}

  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false


server:
  # Railway provides PORT; SERVER_PORT remains available for other hosts/local use.
  port: ${SERVER_PORT:${PORT:8080}}
  servlet:
    context-path: /api
  compression:
    enabled: true
    mime-types: application/json,application/xml,text/html,text/plain
  error:
    include-message: always
    include-binding-errors: always

# ------------------------------------------------------------------
# OMS application configuration
# ------------------------------------------------------------------
oms:
  security:
    jwt:
      secret: ${JWT_SECRET:oms-change-this-secret-in-production-min-32-bytes-long-please}
      expiration-ms: ${JWT_EXPIRATION_MS:86400000}       # 24 hours
    login:
      max-failed-attempts: 5
      lock-duration-minutes: 30
    rate-limit:
      max-requests-per-minute: 300
    password-reset:
      token-ttl-minutes: 30
  lifecycle:
    separate-approver-required: ${LIFECYCLE_SEPARATE_APPROVER_REQUIRED:true}
    scheduler-delay-ms: ${LIFECYCLE_SCHEDULER_DELAY_MS:60000}
  workplace:
    storage-directory: ${WORKPLACE_STORAGE_DIRECTORY:./data/workplace-plans}
    detection:
      # Floor plan recognition. 'none' disables it entirely; 'vision' sends the
      # plan image to the configured model. No key means no detection — the
      # module reports nothing found rather than inventing desks.
      provider: ${WORKPLACE_DETECTION_PROVIDER:none}
      api-key: ${WORKPLACE_DETECTION_API_KEY:}
      base-url: ${WORKPLACE_DETECTION_BASE_URL:https://api.anthropic.com/v1}
      model: ${WORKPLACE_DETECTION_MODEL:claude-sonnet-5}
      api-style: ${WORKPLACE_DETECTION_API_STYLE:anthropic}
      max-objects: ${WORKPLACE_DETECTION_MAX_OBJECTS:400}
    max-plan-bytes: ${WORKPLACE_MAX_PLAN_BYTES:10485760}
    hide-staff-names: ${WORKPLACE_HIDE_STAFF_NAMES:false}
  cors:
    # Local dev serves Angular on 4200 (default) or 4300 (alternate preview port).
    # Deployed environments override this via the CORS_ALLOWED_ORIGINS env var.
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200,http://localhost:4300,http://localhost:8081,http://127.0.0.1:4200,http://127.0.0.1:8081}
  ai:
    # Ask OMS copilot. Default 'template' needs no key and makes no external
    # calls — the deterministic OMS answer is returned as-is. Set to
    # openai | openrouter | azure to have the model polish wording only.
    # The API key is read server-side and is never exposed to the browser.
    provider: ${OMS_AI_PROVIDER:template}
    api-key: ${OMS_AI_API_KEY:}
    base-url: ${OMS_AI_BASE_URL:https://api.openai.com/v1}
    model: ${OMS_AI_MODEL:gpt-4o-mini}
  bootstrap:
    # Default super admin created on first startup if no users exist
    super-admin:
      username: ${SUPER_ADMIN_USERNAME:chairman}
      email: ${SUPER_ADMIN_EMAIL:chairman@sunrichgroup.com}
      password: "${SUPER_ADMIN_PASSWORD:Chairman@2026!}"
      full-name: ${SUPER_ADMIN_NAME:Arjun Wijesinghe}
    group-users:
      chairman-password: "${CHAIRMAN_INITIAL_PASSWORD:Chairman@2026!}"
      company-admin-password: "${COMPANY_ADMIN_INITIAL_PASSWORD:CompanyAdmin@2026!}"
      manager-password: "${MANAGER_INITIAL_PASSWORD:Manager@2026!}"
      staff-password: "${STAFF_INITIAL_PASSWORD:Staff@2026!}"
      read-only-password: "${READ_ONLY_INITIAL_PASSWORD:Viewer@2026!}"
  frontend:
    base-url: ${FRONTEND_BASE_URL:http://localhost:4200}
  gmail:
    enabled: ${GMAIL_ENABLED:false}
    service-account-json: ${GMAIL_SERVICE_ACCOUNT_JSON:}
    sender: ${GMAIL_SENDER:}
  ftp:
    enabled: ${FTP_ENABLED:false}
    host: ${FTP_HOST:localhost}
    port: ${FTP_PORT:21}
    username: ${FTP_USERNAME:}
    password: ${FTP_PASSWORD:}
    base-directory: ${FTP_BASE_DIRECTORY:/oms}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when_authorized

logging:
  level:
    root: INFO
    com.sunrich.oms: ${LOG_LEVEL:INFO}
