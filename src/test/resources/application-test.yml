# Test profile — runs the Spring context against in-memory H2 (no MySQL needed).
spring:
  datasource:
    url: jdbc:h2:mem:oms;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  sql:
    init:
      mode: never          # do NOT run the MySQL-specific schema.sql on H2
  flyway:
    enabled: false         # production migrations contain MySQL-specific DDL

# Deterministic security config for the auth tests
oms:
  workplace:
    # Keep uploaded plan images out of the working directory; the default
    # ./data/workplace-plans is a real folder in the repository.
    storage-directory: ${java.io.tmpdir}/oms-test-workplace-plans
  security:
    jwt:
      secret: test-secret-key-that-is-at-least-32-bytes-long!!
      expiration-ms: 86400000
    login:
      max-failed-attempts: 5
      lock-duration-minutes: 30
    password-reset:
      token-ttl-minutes: 30
  bootstrap:
    super-admin:
      username: chairman
      email: chairman@sunrichgroup.com
      password: Chairman@2026!
      full-name: Arjun Wijesinghe
